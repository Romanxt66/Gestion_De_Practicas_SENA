services:
  web:
    build: .
    container_name: sena_flask_app
    expose:
      - "5001"
    volumes:
      - .:/app
      # Evitamos sobrescribir los directorios de entorno virtual y caché generados localmente
      - /app/.venv
      - /app/__pycache__
    # Las credenciales y secretos se leen del archivo .env (ver .env.example).
    # NO se escriben aquí: este archivo va al repositorio.
    env_file:
      - .env
    environment:
      - FLASK_APP=run.py
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true
