services:
  web:
    build: .
    expose:
      - "5001"
    # El código viaja dentro de la imagen (Dockerfile: COPY . .).
    # NO montar el proyecto sobre /app: taparía lo recién construido y la
    # aplicación seguiría ejecutando la versión anterior.
    # Solo se persiste lo que debe sobrevivir a un redespliegue:
    volumes:
      - evidencias:/app/app/static/uploads   # archivos subidos por los aprendices
      - instancia:/app/instance              # clave de sesión persistida
    # Las credenciales y secretos se leen del archivo .env (ver .env.example).
    # NO se escriben aquí: este archivo va al repositorio.
    env_file:
      - .env
    environment:
      - FLASK_APP=run.py
    networks:
      - coolify
    restart: unless-stopped

volumes:
  evidencias:
  instancia:

networks:
  coolify:
    external: true
